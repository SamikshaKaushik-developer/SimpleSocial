[project]
name = "fastapituitorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.8.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
fastapituitorial = "fastapituitorial:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
